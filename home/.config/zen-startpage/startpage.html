* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--foreground, #e4e4e7); font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid #b6b5a8; outline-offset: 4px; }

.scene { --ink: #e8e8e2; --dim: #84847d; --line: #262624; --surface: #10100f; --selected: #deddd3; --selected-ink: #141413; --today: #8a8a7e; color: var(--ink); padding: 36px 28px; background: #000; border: 1px solid #232321; border-radius: var(--radius, 13px); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.identity { margin: 0 0 19px; color: var(--dim); font-size: 10px; font-weight: 450; letter-spacing: .065em; }
.clock { display: block; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.date { display: block; margin-top: 13px; color: var(--dim); font-size: 11px; letter-spacing: .015em; }
.bookmarks { display: grid; gap: 10px; }
.bookmark { display: flex; align-items: center; min-width: 0; gap: 15px; padding: 17px; color: var(--ink); border: 1px solid var(--line); border-radius: 15px; background: var(--surface); text-decoration: none; transition: transform 240ms cubic-bezier(.2,.75,.25,1), background-color 180ms ease, border-color 180ms ease; }
.bookmark:is(:hover,:focus-visible) { transform: translateY(-4px); background: #1c1c19; border-color: #4b4b42; }
.app-icon { display: block; flex: 0 0 auto; width: 44px; height: 44px; object-fit: contain; transition: transform 240ms cubic-bezier(.2,.75,.25,1); }
.app-icon.github, .app-icon.chatgpt { filter: brightness(0) invert(1); }
.bookmark:is(:hover,:focus-visible) .app-icon { transform: scale(1.08); }
.app-name { font-size: 12px; font-weight: 450; white-space: nowrap; }
.link-arrow { width: 12px; height: 12px; margin-left: auto; color: #64645d; flex-shrink: 0; transition: transform 240ms ease, color 180ms ease; }
.bookmark:is(:hover,:focus-visible) .link-arrow { transform: translate(2px,-2px); color: #dddcd0; }
.calendar-icon { display: grid; place-items: center; border-radius: 9px; background: #3675f5; color: white; font-size: 26px; font-weight: 750; letter-spacing: -.07em; line-height: 1; }
.calendar { min-width: 0; }
.month-heading { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 12px; }
.month-label { margin: 0; color: var(--ink); font-size: 12px; font-weight: 450; white-space: nowrap; }
.month-controls { display: flex; gap: 2px; }
.nav-button { display: inline-grid; place-items: center; width: 25px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--dim); transition: color 150ms ease, background-color 150ms ease; }
.nav-button svg { width: 13px; height: 13px; }
.nav-button:hover { background: #24251f; color: var(--ink); }
.month-grid { width: 100%; table-layout: fixed; border-spacing: 0 3px; text-align: center; font-variant-numeric: tabular-nums; }
.month-grid th { padding: 0; height: 24px; color: var(--dim); font-size: 10px; font-weight: 400; }
.month-grid td { padding: 0; height: 29px; }
.day { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #b6b6aa; font-size: 11px; transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease; }
.day.weekend { color: #848479; }
.day.outside { color: #48483f; }
.day:hover { background: #25251f; color: var(--ink); }
.day[aria-current="date"] { border-color: var(--today); }
.day[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); color: var(--selected-ink); font-weight: 650; }
.selection { display: flex; align-items: center; justify-content: space-between; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
.selected-date { color: #c7c7ba; font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
.reset-row { display: flex; justify-content: center; margin-top: 7px; }
.reset { border: 0; padding: 5px 9px; border-radius: 6px; color: var(--dim); background: transparent; font-size: 10px; }
.reset:hover:enabled { background: #24251f; color: var(--ink); }
.reset:disabled { color: #56564c; cursor: default; }
.grid .identity { text-align: left; }
.grid .clock { font-family: "JetBrains Mono", monospace; font-size: 76px; font-weight: 450; letter-spacing: -.075em; }
.grid .hero { margin-bottom: 29px; }
.grid .layout { display: grid; grid-template-columns: minmax(0,1fr) 228px; align-items: start; gap: 30px; }
.grid .bookmarks { grid-template-columns: repeat(2,minmax(0,1fr)); }
.grid .bookmark { min-height: 81px; padding: 16px 14px; gap: 12px; }
.grid .app-icon { width: 44px; height: 44px; }
.grid .calendar-icon { font-size: 24px; }
.grid .app-name { font-size: 11px; }
.grid .link-arrow { display: none; }
.grid .calendar { padding-left: 21px; border-left: 1px solid var(--line); }

@media (min-width:900px) { .scene-inner { max-width: 820px; margin-inline: auto; }  .grid .app-icon { width: 46px; height: 46px; } .grid .app-name { font-size: 12px; } .grid .bookmark { min-height: 86px; } }
@media (max-width:680px) { .scene { padding: 30px 22px; } .grid .layout { grid-template-columns: minmax(0,1fr) 216px; gap: 20px; } .grid .bookmarks { grid-template-columns: minmax(0,1fr); } .grid .bookmark { min-height: 66px; }      }
@media (max-width:520px) {

 .scene { padding: 30px 18px; }.identity { margin-bottom: 19px; }
 .grid .clock { font-size: 66px; }.grid .layout { grid-template-columns: minmax(0,1fr); gap: 26px; }.grid .bookmarks { grid-template-columns: repeat(2,minmax(0,1fr)); }.grid .bookmark { flex-direction: column; min-height: 95px; padding: 13px 8px; gap: 11px; }.grid .app-icon { width: 42px; height: 42px; }.grid .calendar { width: 280px; max-width: 100%; justify-self: center; padding: 22px 0 0; border-left: 0; border-top: 1px solid var(--line); }

}
@media(prefers-reduced-motion:reduce) { .scene *, .scene *::before, .scene *::after { transition: none !important; }.bookmark:is(:hover,:focus-visible),.bookmark:is(:hover,:focus-visible) .app-icon,.bookmark:is(:hover,:focus-visible) .link-arrow { transform: none; } }

html, body { background: #000; color: #e8e8e2; }
html.startpage-loading .scene { visibility: hidden; }
.scene { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; border: 0; border-radius: 0; padding-top: 12px; padding-bottom: 60px; }
.scene-inner { width: min(100%, 900px); max-width: 900px; min-width: 0; }
.scene { --dim: #99998f; }
.identity { font-size: 12px; }
.date { font-size: 14px; }
.grid .layout { grid-template-columns: minmax(0, 1fr) 260px; gap: 32px; align-items: stretch; }
.grid .bookmarks { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(0, 1fr); }
.grid .bookmark { position: relative; min-height: 100px; padding: 18px 36px 18px 18px; gap: 14px; }
.grid .app-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.pin-symbol, .pin-monogram { display: grid; place-items: center; font-size: 30px; }
.pin-monogram { border-radius: 10px; background: #242420; color: #deddd3; font-size: 23px; }
.bookmarks-empty { grid-column: 1 / -1; align-self: center; color: var(--dim); font-size: 14px; }
.pin-action-notice { position: fixed; z-index: 20; bottom: 22px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 36px); margin: 0; padding: 11px 15px; border: 1px solid #393930; border-radius: 10px; background: #151511; color: #deddd3; font: 13px/1.5 -apple-system, sans-serif; }
.grid .link-arrow { display: block; position: absolute; top: 14px; right: 14px; width: 16px; height: 16px; margin: 0; color: #a6a696; }
.grid .calendar { display: flex; flex-direction: column; padding-left: 24px; }
.month-label { font-size: 15px; }
.nav-button { width: 28px; height: 28px; }
.nav-button svg { width: 15px; height: 15px; }
.month-grid { margin-bottom: 12px; }
.month-grid th { height: 27px; font-size: 12px; }
.month-grid td { height: 32px; }
.day { width: 30px; height: 30px; font-size: 14px; color: #c2c2b6; }
.day.weekend { color: #99998c; }
.day.outside { color: #67675b; }
.selection { margin-top: auto; padding-top: 12px; flex-shrink: 0; }
.selected-date { font-size: 13px; }
.reset-row { flex-shrink: 0; }
.reset { font-size: 12px; }
.reset:disabled { color: #7c7c70; }
@media (max-width: 800px) {
  .scene { padding-top: 6px; padding-bottom: 54px; }
  .grid .layout { grid-template-columns: minmax(0, 1fr) 244px; gap: 24px; }
  .grid .calendar { padding-left: 20px; }
  .grid .bookmark { padding: 16px 32px 16px 16px; gap: 12px; }
}
@media (max-width: 700px) {
  .grid .layout { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .grid .calendar { width: min(100%, 340px); justify-self: center; padding: 22px 0 0; border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .scene { padding-top: 18px; padding-bottom: 42px; }
  .grid .bookmark { min-height: 114px; padding: 18px 25px; gap: 12px; }
  .grid .link-arrow { top: 12px; right: 12px; }
}

.agenda { height: 252px; display: flex; flex-direction: column; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.agenda-header { display: flex; flex: 0 0 32px; min-height: 32px; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
.agenda-title-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
.agenda-heading { margin: 0; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-count { min-width: 2ch; flex-shrink: 0; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.sync-controls { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; }
.sync-status { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.refresh-events { flex-shrink: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; color: #c1c1b5; background: transparent; font-size: 12px; }
.refresh-events:hover:enabled { background: #1b1b18; color: var(--ink); }
.refresh-events:disabled { color: #757568; cursor: default; }
.event-list { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: #45453d transparent; }
.agenda-empty { margin: 0; padding: 13px 0; color: var(--dim); font-size: 13px; line-height: 1.6; }
.event-details { --event-border: #262624; position: relative; isolation: isolate; max-height: 100%; margin-bottom: 8px; padding: 1px; border: 0; border-radius: 11px; background: #000; overflow: hidden; transition: background-color 220ms ease; }
/* Paint the frame above the scrolling/filter layers, including during disclosure. */
.event-details::after { content: ""; position: absolute; z-index: 3; inset: 0; border: 1px solid var(--event-border); border-radius: inherit; pointer-events: none; transition: border-color 220ms ease; }
.event-details:hover, .event-details[open] { --event-border: #3a3a33; background: #11110f; }
.event-details:last-child { margin-bottom: 0; }
.event-details[open] { display: grid; grid-template-columns: minmax(180px, 25%) minmax(0, 1fr); height: 100%; }
.event-details::details-content { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.event-details[open] > .event-summary { grid-column: 1; grid-row: 1; align-self: start; align-items: flex-start; border-radius: 10px 0 0 10px; }
.event-body-viewport { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; min-height: 0; max-height: 100%; }
.event-body-scroll { min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: thin; scrollbar-color: #45453d transparent; }
.event-body-viewport::before, .event-body-viewport::after { content: ""; position: absolute; z-index: 1; left: 0; right: 10px; height: 22px; pointer-events: none; opacity: 0; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); transition: opacity 240ms ease; }
.event-body-viewport::before { top: 0; background: linear-gradient(#11110ff2, #11110f00); mask-image: linear-gradient(#000, transparent); }
.event-body-viewport::after { bottom: 0; background: linear-gradient(#11110f00, #11110ff2); mask-image: linear-gradient(transparent, #000); }
.event-body-viewport[data-scroll-top]::before, .event-body-viewport[data-scroll-bottom]::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .event-body-viewport::before, .event-body-viewport::after { transition: none; } }
.event-summary { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 20px; border: 0; border-radius: 10px; background: #000; cursor: pointer; list-style: none; -webkit-user-select: none; user-select: none; transition: background-color 220ms ease, border-color 220ms ease; }
.event-summary::-webkit-details-marker { display: none; }
.event-summary:hover, .event-details[open] > .event-summary { background: #11110f; }
.event-summary:focus-visible { outline: 2px solid #aaa99b; outline-offset: -2px; }
.event-color { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.event-timing { display: flex; align-items: center; gap: 9px; }
.event-time { color: #b6b6a9; font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.event-summary-text { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.event-title { color: var(--ink); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.event-details[open] .event-summary-text { gap: 12px; }
.event-details[open] .event-title { font-size: 17px; font-weight: 500; line-height: 1.45; letter-spacing: -.015em; }
.event-calendar-name { display: none; }
.disclosure-chevron { display: block; width: 16px; height: 16px; flex: 0 0 16px; color: var(--dim); pointer-events: none; -webkit-user-select: none; user-select: none; transition: transform 320ms cubic-bezier(.22,1,.36,1), color 250ms ease; }
.event-expand { margin-left: auto; transition-duration: 360ms; }
.event-details[open] .event-expand { position: absolute; top: 16px; right: 14px; z-index: 2; }
.event-summary:hover .disclosure-chevron { color: var(--ink); }
.event-details[open]:not([data-closing]) .event-expand { transform: rotate(180deg); }
.event-body { padding: 20px 42px 20px 16px; }
.event-fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 17px 28px; margin: 0; font-size: 12px; line-height: 1.5; }
.event-field { min-width: 0; }
.event-field-wide { grid-column: 1 / -1; }
.event-field-name { margin-bottom: 4px; color: var(--dim); font-size: 10px; line-height: 1.4; }
.event-field-value { color: #d1d1c4; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.event-notes { margin: 15px 0 0; color: #c3c3b5; font-size: 13px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.event-url { display: inline-block; margin-top: 14px; color: #d4d3c3; font-size: 12px; overflow-wrap: anywhere; }
.calendar-list { flex: 0 0 auto; margin: 0; color: var(--dim); font-size: 12px; }
.calendar-list-title { display: flex; align-items: center; gap: 7px; min-height: 29px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; color: #c1c1b5; background: transparent; white-space: nowrap; cursor: pointer; list-style: none; -webkit-user-select: none; user-select: none; transition: background-color 300ms cubic-bezier(.22,1,.36,1), border-color 300ms ease; }
.calendar-list-title::-webkit-details-marker { display: none; }
.calendar-list-title:hover { background: #1b1b18; border-color: #45453d; }
.calendar-list-title:focus-visible { outline: 2px solid #aaa99b; outline-offset: 3px; }
.calendar-list[open]:not([data-closing]) .disclosure-chevron { transform: rotate(180deg); }
.calendar-list-items { position: absolute; z-index: 10; top: calc(100% + 8px); right: 0; display: grid; gap: 12px; width: min(300px, calc(100vw - 36px)); max-height: 200px; overflow-y: auto; margin: 0; padding: 15px; border: 1px solid #30302b; border-radius: 11px; background: #111110; box-shadow: 0 10px 30px #0009; list-style: none; scrollbar-width: thin; scrollbar-color: #45453d transparent; }
.calendar-list-item { display: flex; align-items: center; gap: 9px; min-width: 0; color: #c1c1b5; line-height: 1.5; overflow-wrap: anywhere; }
.day { position: relative; height: 34px; }
.month-grid td { height: 36px; }
.event-dots { position: absolute; display: flex; gap: 2px; bottom: 2px; left: 50%; transform: translateX(-50%); }
.event-day-dot { width: 3px; height: 3px; border-radius: 50%; }
.day[aria-pressed="true"] .event-day-dot { background: #46463e !important; }
.day, .nav-button, .reset, .refresh-events { transition: color 300ms cubic-bezier(.22,1,.36,1), background-color 300ms cubic-bezier(.22,1,.36,1), border-color 300ms cubic-bezier(.22,1,.36,1); }
.bookmark, .app-icon, .link-arrow { transition-duration: 340ms; transition-timing-function: cubic-bezier(.22,1,.36,1); }
@media (max-width:700px) {
 .agenda { height: 292px; }
 .agenda-header { flex-basis: 64px; min-height: 64px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 10px; }
 .agenda-title-row { max-width: 100%; }
 .sync-controls { width: 100%; justify-content: space-between; }
 .event-time { font-size: 11px; }
 .event-details[open] { display: flex; flex-direction: column; }
 .event-details::details-content { border-left: 0; }
 .event-details[open] > .event-summary { padding-right: 40px; border-radius: 10px 10px 0 0; }
 .event-summary { gap: 9px; }
 .event-body { padding: 4px 20px 20px; }
 .event-fields { gap: 16px 20px; }
}
@media (max-width:420px) { .event-fields { grid-template-columns: minmax(0,1fr); } }

<script>
(() => {
  const fullDate = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const dateFormat = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  const shortDate = new Intl.DateTimeFormat('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
  const monthFormat = new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' });
  const clockFormat = new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit', hour12: false });
  const dateKey = d => [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  const parseKey = key => { const [y,m,d] = key.split('-').map(Number); return new Date(y,m-1,d); };
  const sameMonth = (a,b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
  const chevron = direction => `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="${direction < 0 ? 'm10 4-4 4 4 4' : 'm6 4 4 4-4 4'}" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  document.querySelectorAll('.scene').forEach(root => {
    const q = selector => root.querySelector(selector);
    const clock = q('[data-clock]');
    const dateLabel = q('[data-date]');
    const calendar = q('.calendar');
    const monthLabel = q('[data-month-label]');
    const monthTable = q('.month-grid');
    const dayRows = q('[data-days]');
    const selectedLabel = q('[data-selected-date]');
    const todayButton = q('[data-today]');
    let selected = parseKey(dateKey(new Date()));
    let view = new Date(selected.getFullYear(), selected.getMonth(), 1);
    let lastToday = '';
    let followToday = true;

    function render() {
      const now = new Date();
      const today = dateKey(now);
      const selectedKey = dateKey(selected);
      const offset = (view.getDay() + 6) % 7;
      const year = view.getFullYear(), month = view.getMonth();
      const title = monthFormat.format(view).replace(' г.', '');
      monthLabel.textContent = title;
      monthTable.setAttribute('aria-label', title);
      selectedLabel.textContent = shortDate.format(selected);
      selectedLabel.dateTime = selectedKey;
      todayButton.disabled = selectedKey === today && sameMonth(view,now);
      const fragment = document.createDocumentFragment();
      let selectedVisible = false;
      for (let week = 0; week < 6; week++) {
        const row = document.createElement('tr');
        for (let day = 0; day < 7; day++) {
          const value = new Date(year, month, 1 - offset + week * 7 + day);
          const key = dateKey(value);
          const cell = document.createElement('td');
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'day';
          button.dataset.date = key;
          button.textContent = value.getDate();
          button.setAttribute('aria-label',fullDate.format(value));
          button.setAttribute('aria-pressed',String(key === selectedKey));
          button.tabIndex = key === selectedKey ? 0 : -1;
          if (key === selectedKey) selectedVisible = true;
          if (!sameMonth(value,view)) button.classList.add('outside');
          if (day > 4) button.classList.add('weekend');
          if (key === today) button.setAttribute('aria-current','date');
          cell.append(button); row.append(cell);
        }
        fragment.append(row);
      }
      dayRows.replaceChildren(fragment);
      if (!selectedVisible) q('.day:not(.outside)').tabIndex = 0;
      root.dispatchEvent(new CustomEvent('zen-calendar-render'));
    }

    function select(value, focusDay = false) {
      selected = parseKey(dateKey(value));
      view = new Date(selected.getFullYear(), selected.getMonth(), 1);
      followToday = dateKey(selected) === dateKey(new Date());
      render();
      if (focusDay) q('.day[aria-pressed="true"]').focus({ preventScroll: true });
    }

    function stepDay(delta) {
      select(new Date(selected.getFullYear(), selected.getMonth(), selected.getDate() + delta));
    }

    root.querySelectorAll('[data-step-month]').forEach(button => {
      button.innerHTML = chevron(Number(button.dataset.stepMonth));
      button.addEventListener('click',() => {
        const target = new Date(view.getFullYear(), view.getMonth() + Number(button.dataset.stepMonth), 1);
        const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
        select(new Date(target.getFullYear(), target.getMonth(), Math.min(selected.getDate(), last)));
      });
    });
    root.querySelectorAll('[data-step-day]').forEach(button => {
      button.innerHTML = chevron(Number(button.dataset.stepDay));
      button.addEventListener('click',() => stepDay(Number(button.dataset.stepDay)));
    });
    dayRows.addEventListener('click',event => {
      const day = event.target.closest('[data-date]');
      if (day && dayRows.contains(day)) select(parseKey(day.dataset.date),true);
    });
    calendar.addEventListener('keydown',event => {
      const day = event.target.closest('.day');
      if (!day || event.ctrlKey || event.metaKey || event.altKey) return;
      const value = parseKey(day.dataset.date);
      const deltas = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7 };
      let next;
      if (event.key in deltas) next = new Date(value.getFullYear(),value.getMonth(),value.getDate()+deltas[event.key]);
      else if (event.key === 'Home' || event.key === 'End') {
        const offset = (value.getDay()+6)%7;
        next = new Date(value.getFullYear(),value.getMonth(),value.getDate()-offset+(event.key === 'End'?6:0));
      } else if (event.key === 'PageUp' || event.key === 'PageDown') {

    if (!url) return null;
    const preset = presets.get(key(url.href));
    const link = document.createElement('a');
    link.className = 'bookmark'; link.href = url.href;
    link.target = '_blank'; link.rel = 'noopener noreferrer';
    let icon;
    if (pin.customIcon && pin.symbol) {
      icon = document.createElement('span'); icon.className = 'app-icon pin-symbol'; icon.textContent = pin.symbol;
    } else if ((!preset || pin.customIcon) && safeImage(pin.image)) {
      icon = document.createElement('img'); icon.className = 'app-icon'; icon.src = pin.image; icon.alt = '';
    } else if (preset) {
      icon = preset.querySelector('.app-icon')?.cloneNode(true);
    }
    if (!icon) {
      icon = document.createElement('span'); icon.className = 'app-icon pin-monogram';
      icon.textContent = (pin.title || url.hostname.replace(/^www\./,'')).trim().slice(0,1).toUpperCase();
    }
    icon.setAttribute('aria-hidden','true');
    const day = icon.matches('[data-icon-day]') ? icon : icon.querySelector('[data-icon-day]');
    if (day) day.textContent = new Date().getDate();
    const label = document.createElement('span'); label.className = 'app-name';
    label.textContent = preset?.querySelector('.app-name')?.textContent || pin.title || url.host;
    link.setAttribute('aria-label',label.textContent); link.title = label.textContent;
    link.append(icon,label);
    if (arrow) link.append(arrow.cloneNode(true));
    return link;
  }
  function render(data) {
    if (!Array.isArray(data.pins)) return;
    const next = JSON.stringify(data.pins);
    if (next === signature) return;
    const content = document.createDocumentFragment();
    data.pins.forEach(pin => { if (pin && typeof pin === 'object') { const link = card(pin); if (link) content.append(link); } });
    if (!content.childNodes.length) {
      const empty = document.createElement('p'); empty.className = 'bookmarks-empty';
      empty.textContent = 'Закреплённых вкладок пока нет'; content.append(empty);
    }
    const focused = nav.contains(document.activeElement) ? document.activeElement.href : null;
    const firstUpdate = !signature;
    signature = next;
    transition?.cancel();
    nav.replaceChildren(content);
    reveal();
    try { sessionStorage.setItem(cacheKey, next); } catch { /* Storage may be unavailable on file URLs. */ }
    nav.setAttribute('aria-label','Закреплённые вкладки Zen');
    if (focused) [...nav.querySelectorAll('a')].find(a => a.href === focused)?.focus({preventScroll:true});
    if (!firstUpdate && !reducedMotion.matches && nav.animate) {
      transition = nav.animate([{opacity:0},{opacity:1}],{duration:300,easing:'cubic-bezier(.22,1,.36,1)'});
    }
  }
  async function update() {
    controller?.abort(); controller = new AbortController();
    const request = controller;
    const timeout = setTimeout(() => request.abort(),5000);
    try {
      const response = await fetch(config.baseURL + '/v1/pins',{
        headers:{Authorization:'Bearer ' + config.token},signal:request.signal,
        cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'
      });
      if (!response.ok) throw new Error('pins');
      const data = await response.json();
      if (!Array.isArray(data.pins)) throw new Error('pins');
      if (controller === request) render(data);
    } catch { if (controller === request) unavailable(); }
    finally { clearTimeout(timeout); }
  }
  window.addEventListener('focus',update);
  document.addEventListener('visibilitychange',() => { if (!document.hidden) update(); });
  setInterval(() => { if (!document.hidden) update(); },30000);
  try {
    const cached = JSON.parse(sessionStorage.getItem(cacheKey));
    if (Array.isArray(cached)) render({pins:cached});
  } catch { /* The first load waits for the helper instead of showing sample cards. */ }
  update();
})();

</script>
</body>
