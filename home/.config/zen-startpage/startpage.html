<!DOCTYPE html>
<!-- Zen startpage. To change tiles edit the <a class="tile"> blocks below.
     Source of truth: ~/dotfiles/home/.config/zen-startpage/startpage.html -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", Inter, sans-serif;
    background: #050607;
    color: #f2f4f8;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(700px 340px at 50% -60px, rgba(70, 110, 160, .16), transparent 70%),
      radial-gradient(900px 600px at 50% 115%, rgba(20, 24, 32, .6), transparent 70%);
  }
  main { position: relative; text-align: center; width: min(560px, 90vw); }
  .clock { font-size: 84px; font-weight: 700; letter-spacing: -3px;
    font-variant-numeric: tabular-nums; line-height: 1; }
  .date { margin-top: 10px; font-size: 14px; color: #8b93a3; }
  form { margin-top: 28px; }
  .search {
    width: 100%; padding: 13px 22px; font-size: 14px; color: #eee;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.11); border-radius: 999px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .search::placeholder { color: rgba(255,255,255,.38); }
  .search:focus { border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.08); }
  .grid { margin-top: 30px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
  .tile { text-decoration: none; display: flex; flex-direction: column;
    align-items: center; gap: 8px; }
  .icon {
    width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
    transition: transform .15s;
  }
  .tile:hover .icon { transform: translateY(-3px); }
  .label { font-size: 11px; color: #8b93a3; }
  .hint { margin-top: 34px; font-size: 11px; color: #4a505c; }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <form id="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
    <input class="search" id="q" name="q" type="text"
           placeholder="Поиск DuckDuckGo или адрес…" autofocus>
  </form>
  <div class="grid">
    <a class="tile" href="https://github.com"><span class="icon" style="background:#24292f">G</span><span class="label">GitHub</span></a>
    <a class="tile" href="https://youtube.com"><span class="icon" style="background:#c81e1e">Y</span><span class="label">YouTube</span></a>
    <a class="tile" href="https://mail.google.com"><span class="icon" style="background:#1a73e8">M</span><span class="label">Gmail</span></a>
    <a class="tile" href="https://chatgpt.com"><span class="icon" style="background:#10a37f">C</span><span class="label">ChatGPT</span></a>
    <a class="tile" href="https://claude.ai"><span class="icon" style="background:#d97757">C</span><span class="label">Claude</span></a>
    <a class="tile" href="https://figma.com"><span class="icon" style="background:#9747ff">F</span><span class="label">Figma</span></a>
    <a class="tile" href="https://open.spotify.com"><span class="icon" style="background:#1db954">S</span><span class="label">Spotify</span></a>
    <a class="tile" href="https://gitlab.com"><span class="icon" style="background:#fc6d26">L</span><span class="label">GitLab</span></a>
  </div>
  <div class="hint">нажми / чтобы искать</div>
</main>
<script>
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
      String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0");
    const h = now.getHours();
    const greet = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" :
                  h < 18 ? "Добрый день" : "Добрый вечер";
    document.getElementById("date").textContent =
      greet + " · " + now.toLocaleDateString("ru-RU",
        { weekday: "short", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 10000);
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement.id !== "q") {
      e.preventDefault();
      document.getElementById("q").focus();
    }
  });
</script>
</body>
</html>
