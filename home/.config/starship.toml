"$schema" = 'https://starship.rs/config-schema.json'
palette = 'midnight_plum'

format = """
$username\
$hostname\
$shell\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[shell]
disabled = false
format = '[$indicator]($style)'
style = 'bold lavender'
bash_indicator = 'bash '
fish_indicator = ''
zsh_indicator = ''
powershell_indicator = ''
ion_indicator = ''
elvish_indicator = ''
tcsh_indicator = ''
nu_indicator = ''
xonsh_indicator = ''
cmd_indicator = ''
unknown_indicator = ''

[directory]
style = "bold lavender"

[character]
success_symbol = "[❯](lavender)"
error_symbol = "[❯](rose)"
vimcmd_symbol = "[❮](ice)"

[git_branch]
format = "[$branch]($style)"
style = "ice"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](rose) ($ahead_behind$stashed)]($style)"
style = "mist"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "muted"

[cmd_duration]
format = "[$duration]($style) "
style = "muted"

[python]
format = "[$virtualenv]($style) "
style = "muted"
detect_extensions = []
detect_files = []

[palettes.midnight_plum]
lavender = "#dc9cff"
rose = "#ff9fce"
ice = "#7edbea"
mist = "#8cbcff"
muted = "#a395a8"
