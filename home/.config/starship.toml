"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$shell\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[shell]
disabled = false
format = '[$indicator]($style)'
style = 'bold #9EB8D8'
bash_indicator = 'bash '
fish_indicator = ''
zsh_indicator = ''
powershell_indicator = ''
ion_indicator = ''
elvish_indicator = ''
tcsh_indicator = ''
nu_indicator = ''
xonsh_indicator = ''
cmd_indicator = ''
unknown_indicator = ''

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "#00e08e"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "#9EB8D8"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
